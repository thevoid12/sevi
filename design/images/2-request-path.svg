<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="460" fill="#ffffff"/>
<text x="550.0" y="47.0" font-size="26" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">A message&#x27;s path, and who gets stopped on the way</text>
<rect x="30" y="90" width="190" height="90" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="125.0" y="124.6" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Telegram</text>
<text x="125.0" y="145.4" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">sends the update</text>
<rect x="240" y="90" width="190" height="90" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="335.0" y="135.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">API Gateway</text>
<rect x="450" y="90" width="190" height="90" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="545.0" y="124.6" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Cloud Run</text>
<text x="545.0" y="145.4" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(private)</text>
<rect x="660" y="90" width="190" height="90" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="755.0" y="135.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Telegram adapter</text>
<rect x="870" y="90" width="190" height="90" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="965.0" y="135.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Core</text>
<polyline points="220,135 240,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="430,135 450,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="640,135 660,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="850,135 870,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="125,180 125,235" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="30" y="235" width="190" height="170" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="125.0" y="254.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Telegram retries an</text>
<text x="125.0" y="272.2" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">update until it gets</text>
<text x="125.0" y="290.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">a 200 answer</text>
<polyline points="335,180 335,235" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="240" y="235" width="190" height="170" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="335.0" y="254.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Checks:</text>
<text x="335.0" y="272.2" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• the API key in the URL</text>
<text x="335.0" y="290.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"></text>
<text x="335.0" y="308.6" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">No key, or a wrong one:</text>
<text x="335.0" y="326.8" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">refused. No instance</text>
<text x="335.0" y="345.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">is started.</text>
<polyline points="545,180 545,235" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="450" y="235" width="190" height="170" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="545.0" y="254.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Checks:</text>
<text x="545.0" y="272.2" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• only the gateway&#x27;s</text>
<text x="545.0" y="290.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">  service account may call</text>
<text x="545.0" y="308.6" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"></text>
<text x="545.0" y="326.8" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">The Cloud Run URL</text>
<text x="545.0" y="345.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">directly: 403.</text>
<polyline points="755,180 755,235" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="660" y="235" width="190" height="170" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="755.0" y="254.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Checks:</text>
<text x="755.0" y="272.2" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• secret header</text>
<text x="755.0" y="290.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• body under 64 KB</text>
<text x="755.0" y="308.6" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• sender is on the list</text>
<text x="755.0" y="326.8" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• not seen before</text>
<text x="755.0" y="345.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"></text>
<text x="755.0" y="363.2" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Wrong secret: 403.</text>
<text x="755.0" y="381.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Other senders: ignored.</text>
<polyline points="965,180 965,235" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="870" y="235" width="190" height="170" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="965.0" y="254.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Checks:</text>
<text x="965.0" y="272.2" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">• short-lived signed</text>
<text x="965.0" y="290.4" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">  token from the adapter</text>
<text x="965.0" y="308.6" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"></text>
<text x="965.0" y="326.8" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">No token: 401.</text>
</svg>