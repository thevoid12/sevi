<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" width="1100" height="880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="880" fill="#ffffff"/>
<text x="550.0" y="47.0" font-size="26" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Blog link to audio</text>
<rect x="360" y="70" width="360" height="64" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="102.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">You send a blog link</text>
<rect x="360" y="170" width="360" height="64" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="191.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Already made with</text>
<text x="540.0" y="212.4" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">this voice and model?</text>
<rect x="360" y="270" width="360" height="64" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="291.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Read the page (Jina)</text>
<text x="540.0" y="312.40000000000003" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">the text is cached in Neon</text>
<rect x="360" y="370" width="360" height="64" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="391.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Cut the text into chunks</text>
<text x="540.0" y="412.40000000000003" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">of about 3000 characters</text>
<rect x="360" y="470" width="360" height="64" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="491.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Estimate the cost</text>
<text x="540.0" y="512.4" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">over $0.20: ask yes / no</text>
<rect x="360" y="570" width="360" height="64" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="591.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Speak chunk by chunk</text>
<text x="540.0" y="612.4" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(Gemini speech model)</text>
<rect x="360" y="670" width="360" height="64" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="691.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Join the chunks, encode MP3</text>
<text x="540.0" y="712.4" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">save to R2 and Neon</text>
<rect x="360" y="770" width="360" height="64" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="540.0" y="791.6" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Send the audio and the cost</text>
<text x="540.0" y="812.4" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">to Telegram</text>
<polyline points="540.0,134 540.0,170" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="540.0,234 540.0,270" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="540.0,334 540.0,370" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="540.0,434 540.0,470" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="540.0,534 540.0,570" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="540.0,634 540.0,670" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<polyline points="540.0,734 540.0,770" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<rect x="790" y="170" width="270" height="64" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="925.0" y="192.25" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Yes: send the saved MP3</text>
<text x="925.0" y="211.75" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">from R2. Free.</text>
<polyline points="720,202 790,202" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<text x="755" y="188.0" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e" stroke="#fff" stroke-width="5" paint-order="stroke">yes</text>
<rect x="30" y="470" width="270" height="64" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="165.0" y="492.25" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Skipped when you are</text>
<text x="165.0" y="511.75" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">continuing an earlier try</text>
<polyline points="300,502 360,502" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="790" y="570" width="270" height="64" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="925.0" y="592.25" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">A chunk fails?</text>
<text x="925.0" y="611.75" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">see &quot;When speech fails&quot;</text>
<polyline points="720,602 790,602" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="30" y="270" width="270" height="64" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="165.0" y="292.25" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Same link again later:</text>
<text x="165.0" y="311.75" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">the page text comes from Neon</text>
<polyline points="300,302 360,302" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
</svg>