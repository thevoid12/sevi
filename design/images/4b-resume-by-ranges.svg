<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="550" y="40" font-size="24" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Resuming by character ranges: merge what is done, split what is missing</text>
<text x="50" y="82" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#1e1e1e">1. First try (chunk size 3000): positions are characters of the cleaned article, 0 to 8000</text>
<rect x="50.0" y="100" width="325.0" height="44" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="212.5" y="122" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">chunk 1 done</text>
<rect x="375.0" y="100" width="325.0" height="44" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="537.5" y="122" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">chunk 2 done</text>
<rect x="700.0" y="100" width="350.0" height="44" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="875.0" y="122" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">chunk 3 failed</text>
<text x="50.0" y="158" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">0</text>
<text x="375.0" y="158" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">2600</text>
<text x="700.0" y="158" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">5200</text>
<text x="1050.0" y="158" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">8000</text>
<text x="50" y="200" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#1e1e1e">2. What is saved: one table plus one audio file (Opus, all finished stretches joined in text order)</text>
<rect x="50" y="220" width="480" height="80" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="290.0" y="241.1" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">ranges: 0-2600 (160 s) and 2600-5200 (155 s)</text>
<text x="290.0" y="260.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">touch, so they are stored as ONE row:</text>
<text x="290.0" y="278.9" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">0-5200  ->  315 s of audio</text>
<rect x="560" y="220" width="490" height="80" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="805.0" y="241.1" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">also stored: hash and length of the article text</text>
<text x="805.0" y="260.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(a different text means the checkpoint is ignored)</text>
<text x="805.0" y="278.9" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">and the cost already paid</text>
<text x="50" y="335" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#1e1e1e">3. Second try (chunk size now 800): walk the table, anything not covered is a gap</text>
<rect x="50.0" y="355" width="650.0" height="44" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="375.0" y="377" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">saved 0-5200: kept as is, never cut</text>
<rect x="700.0" y="355" width="100.0" height="44" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="750.0" y="377" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">5200-6000</text>
<rect x="800.0" y="355" width="100.0" height="44" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="850.0" y="377" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">6000-6800</text>
<rect x="900.0" y="355" width="100.0" height="44" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="950.0" y="377" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">6800-7600</text>
<rect x="1000.0" y="355" width="50.0" height="44" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1025.0" y="377" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">7600-8000</text>
<text x="875.0" y="417" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">gap 5200-8000 is cut again at 800: four chunks, made three at a time</text>
<text x="50" y="450" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#1e1e1e">4. Stitch: old and new pieces together, sorted by start position, then joined</text>
<rect x="50" y="470" width="300" height="60" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="200.0" y="490.55" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">0-5200</text>
<text x="200.0" y="509.45" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(from the checkpoint)</text>
<rect x="360" y="470" width="160" height="60" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="440.0" y="490.55" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">5200-6000</text>
<text x="440.0" y="509.45" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(new)</text>
<rect x="530" y="470" width="160" height="60" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="610.0" y="490.55" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">6000-6800</text>
<text x="610.0" y="509.45" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(new)</text>
<rect x="700" y="470" width="160" height="60" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="490.55" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">6800-7600</text>
<text x="780.0" y="509.45" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(new)</text>
<rect x="870" y="470" width="160" height="60" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="950.0" y="490.55" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">7600-8000</text>
<text x="950.0" y="509.45" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(new)</text>
<polyline points="550,530 550,560" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<rect x="50" y="560" width="1000" height="60" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="550.0" y="580.55" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Check: the ranges must cover 0 to 8000 with no hole, then encode the MP3. The result is one complete audio.</text>
<text x="550.0" y="599.4499999999999" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">A different chunk size on the second try changes nothing: only positions matter.</text>
</svg>
